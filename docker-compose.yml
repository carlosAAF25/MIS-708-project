version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sistema_pedidos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sistema_pedidos"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672" # Puerto AMQP para microservicios
      - "15672:15672" # Panel web para tu demo en vivo
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5

  stub-pasarela:
    build: ./stub-pasarela
    ports:
      - "8080:8080"
    environment:
      - ERROR_RATE=0.3 # 30% de fallos configurables según rúbrica
      - MAX_LATENCY_MS=5000 

  catalogo:
    build: ./catalogo
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=sistema_pedidos
      - DB_SCHEMA=catalogo_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - JWT_SECRET=examen_jwt_secret
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  pedidos:
    build: ./pedidos
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=sistema_pedidos
      - DB_SCHEMA=pedidos_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - CATALOGO_URL=http://catalogo:3001
      - JWT_SECRET=examen_jwt_secret
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  pagos:
    build: ./pagos
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=sistema_pedidos
      - DB_SCHEMA=pagos_db
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - PASARELA_URL=http://stub-pasarela:8080
      - JWT_SECRET=examen_jwt_secret
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      stub-pasarela:
        condition: service_started

volumes:
  pgdata: